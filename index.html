<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meal Check-In</title>

    <!-- QR SCANNER LIBRARY -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin-top: 8px;
            color: #666;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #111827;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        button:active {
            transform: scale(0.98);
        }

        #reader {
            width: 100%;
            max-width: 450px;
            margin: auto;
        }

        #result {
            margin-top: 20px;
            padding: 18px;
            text-align: center;
            border-radius: 12px;
            background: #f1f5f9;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .success {
            background: #dcfce7 !important;
            color: #166534;
        }

        .duplicate {
            background: #fef3c7 !important;
            color: #92400e;
        }

        .error {
            background: #fee2e2 !important;
            color: #991b1b;
        }

        .name {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .status {
            font-size: 19px;
            font-weight: bold;
        }

        .small {
            font-size: 14px;
            margin-top: 6px;
        }

        .camera-status {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>Meal Check-In</h1>

        <p>
            Scan the guest QR code
        </p>

    </div>


    <!-- DATA SYNC STATUS -->

    <div class="card" id="syncCard">

        <div id="syncStatus" class="camera-status" style="margin:0;">
            Loading guest list…
        </div>

    </div>


    <!-- SETTINGS -->

    <div class="card">

        <label>
            Station
        </label>

        <input
            id="station"
            type="text"
            value="Station 1"
        >


        <label>
            Meal
        </label>

        <input
            id="meal"
            type="text"
            value="Meal"
        >


        <button
            id="startButton"
            onclick="requestCamera()"
        >
            📷 Start Camera
        </button>

    </div>


    <!-- SCANNER -->

    <div class="card">

        <div
            id="cameraStatus"
            class="camera-status"
        >
            Camera not started
        </div>


        <div id="reader"></div>


        <div id="result">

            <div>
                Press "Start Camera"
            </div>

        </div>

    </div>


    <!-- MANUAL ENTRY FALLBACK -->

    <div class="card">

        <label>
            Manual Entry (if scan fails)
        </label>

        <input
            id="manualId"
            type="text"
            placeholder="Enter Guest ID"
            autocomplete="off"
            autocapitalize="characters"
        >

        <button
            id="manualButton"
            onclick="submitManualEntry()"
        >
            ✅ Check In Manually
        </button>

    </div>


</div>


<script>


//==================================================
// APPS SCRIPT URL
//==================================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyrO6ACLcH2XctMwaKeIRoTdGYGR6dlo6ZtfPBSiTOCV8_5FbQTWANZFIAllRXV3Lg/exec";


//==================================================
// VARIABLES
//==================================================

let scanner = null;

let processing = false;

let lastScanned = "";

let lastScanTime = 0;


// Local cache of all guests, keyed by Guest ID.
// This is what makes check-in instant: we verify
// against this Map first, and only talk to the
// Sheet in the background to persist the result.

let guestMap = new Map();

let guestsLoaded = false;


//==================================================
// LOAD GUEST LIST FROM SHEET (ONCE, ON PAGE LOAD)
//==================================================

async function loadGuestData() {

    const statusEl =
        document.getElementById("syncStatus");

    try {

        const response = await fetch(
            SCRIPT_URL + "?action=guests"
        );

        const data = await response.json();

        if (data.status !== "ok") {

            throw new Error(
                data.message || "Failed to load guests."
            );

        }

        guestMap = new Map(
            data.guests.map(
                g => [g.id, {
                    name: g.name,
                    taken: g.taken,
                    enrollmentId: g.enrollmentId || "",
                    school: g.school || ""
                }]
            )
        );

        guestsLoaded = true;

        statusEl.innerText =
            `Loaded ${guestMap.size} guests — ready to scan`;

    }

    catch (error) {

        console.error(
            "Guest list load error:",
            error
        );

        guestsLoaded = false;

        statusEl.innerText =
            "⚠ Could not load guest list. Retrying…";

        // Retry after a few seconds — without this list
        // check-in can't run offline-fast.

        setTimeout(loadGuestData, 4000);

    }

}


// Kick off the preload as soon as the page opens,
// so the list is ready before the user even starts
// the camera.

loadGuestData();


//==================================================
// REFRESH GUEST LIST ON DEMAND
// (e.g. if new guests were added mid-event)
//==================================================

function refreshGuestData() {

    loadGuestData();

}


//==================================================
// REQUEST CAMERA PERMISSION
//==================================================

async function requestCamera() {

    try {

        // Check browser support

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            showResult(
                "error",
                `
                <div class="status">
                    Camera Not Supported
                </div>

                <div class="small">
                    Please open this page in Chrome or Safari.
                </div>
                `
            );

            return;
        }


        // Request camera permission

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "environment"
                },

                audio: false

            });


        // Permission granted

        document
            .getElementById("cameraStatus")
            .innerText =
            "Camera permission granted";


        // Stop temporary camera stream

        stream
            .getTracks()
            .forEach(
                track => track.stop()
            );


        // Start QR scanner

        startScanner();


    }

    catch (error) {

        console.error(
            "Camera Error:",
            error
        );


        if (
            error.name === "NotAllowedError"
        ) {

            showResult(
                "error",
                `
                <div class="status">
                    Camera Permission Denied
                </div>

                <div class="small">
                    Please allow camera access
                    in your phone settings.
                </div>
                `
            );

        }

        else if (
            error.name === "NotFoundError"
        ) {

            showResult(
                "error",
                `
                <div class="status">
                    No Camera Found
                </div>
                `
            );

        }

        else {

            showResult(
                "error",
                `
                <div class="status">
                    Camera Error
                </div>

                <div class="small">
                    ${error.message}
                </div>
                `
            );

        }

    }

}


//==================================================
// START QR SCANNER
//==================================================

function startScanner() {

    if (scanner) {
        return;
    }


    scanner =
        new Html5Qrcode("reader");


    scanner.start(

        // IMPORTANT:
        // Keep this as a STRING.
        // Do NOT change it to an object.

        {
            facingMode: "environment"
        },


        // Scanner settings

        {
            fps: 15,

            qrbox: {
                width: 280,
                height: 280
            },

            aspectRatio: 1.0
        },


        // QR SUCCESS

        onScanSuccess,


        // QR ERROR

        onScanError

    )


    .then(() => {

        document
            .getElementById("cameraStatus")
            .innerText =
            "Camera active — scan QR";


        showResult(
            "",
            `
            <div class="status">
                Ready for Scan
            </div>

            <div class="small">
                Point the camera at a QR code.
            </div>
            `
        );


        document
            .getElementById("startButton")
            .innerText =
            "Camera Running";


        document
            .getElementById("startButton")
            .disabled =
            true;

    })


    .catch(error => {

        console.error(
            "Scanner Error:",
            error
        );


        showResult(
            "error",
            `
            <div class="status">
                Unable to Start Scanner
            </div>

            <div class="small">
                ${error}
            </div>
            `
        );

    });

}


//==================================================
// QR SCAN SUCCESS
//==================================================

function onScanSuccess(decodedText) {

    const now =
        Date.now();


    // Prevent duplicate scanning

    if (

        processing ||

        (
            decodedText === lastScanned &&
            now - lastScanTime < 3000
        )

    ) {

        return;
    }


    // Save scan

    lastScanned =
        decodedText;

    lastScanTime =
        now;


    processGuestId(decodedText, "scan");

}


//==================================================
// OPTIONAL DETAILS (ENROLLMENT ID / SCHOOL)
// Only rendered when the guest record has them —
// these fields are not required.
//==================================================

function optionalDetailsHtml(guest) {

    let html = "";

    if (guest.enrollmentId) {

        html += `
        <div class="small">
            Enrollment ID: ${guest.enrollmentId}
        </div>
        `;

    }

    if (guest.school) {

        html += `
        <div class="small">
            School: ${guest.school}
        </div>
        `;

    }

    return html;

}


//==================================================
// PROCESS A GUEST ID (FROM SCAN OR MANUAL ENTRY)
// Checks the LOCAL cache instantly, updates the UI
// right away, then syncs to Apps Script/Sheet in
// the background so the user never has to wait on
// the network.
//==================================================

function processGuestId(rawId, source) {

    if (processing) {
        return;
    }

    const guestId =
        String(rawId || "")
            .trim()
            .toUpperCase();

    if (!guestId) {
        return;
    }

    processing = true;


    // Guest list hasn't finished loading yet —
    // we can't verify safely offline, so wait
    // instead of risking a false "invalid".

    if (!guestsLoaded) {

        showResult(
            "error",
            `
            <div class="status">
                ⏳ Still Loading Guest List
            </div>

            <div class="small">
                Please wait a moment and try again.
            </div>
            `
        );

        processing = false;

        return;

    }


    const guest =
        guestMap.get(guestId);


    // NOT FOUND

    if (!guest) {

        showResult(
            "error",
            `
            <div class="status">
                ✗ INVALID QR
            </div>

            <div class="small">
                Guest ID "${guestId}" not found.
            </div>
            `
        );

        finishProcessing();

        return;

    }


    // ALREADY COLLECTED (checked locally, instantly)

    if (guest.taken) {

        showResult(
            "duplicate",
            `
            <div class="name">
                ${guest.name}
            </div>

            <div class="status">
                ⚠ ALREADY COLLECTED
            </div>

            <div class="small">
                Guest ID: ${guestId}
            </div>

            ${optionalDetailsHtml(guest)}
            `
        );

        finishProcessing();

        return;

    }


    // SUCCESS — mark locally right away so a
    // second scan/entry is instantly caught as a
    // duplicate even before the server confirms.

    guest.taken = true;

    guestMap.set(guestId, guest);

    showResult(
        "success",
        `
        <div class="name">
            ${guest.name}
        </div>

        <div class="status">
            ✓ MEAL COLLECTED
        </div>

        <div class="small">
            Guest ID: ${guestId}
            ${source === "manual" ? " (manual entry)" : ""}
        </div>

        ${optionalDetailsHtml(guest)}
        `
    );


    // Persist to the Sheet in the background —
    // UI has already moved on, no waiting.

    syncToServer(guestId);

    finishProcessing();

}


//==================================================
// RESET FOR NEXT SCAN
//==================================================

function finishProcessing() {

    setTimeout(

        () => {

            processing =
                false;

            showResult(

                "",

                `
                <div class="status">
                    Ready for Next Scan
                </div>
                `

            );

        },

        1000

    );

}


//==================================================
// BACKGROUND SYNC TO APPS SCRIPT / SHEET
// Fire-and-forget: the UI has already updated, this
// just makes sure the Sheet catches up. Errors are
// logged, not shown, so a flaky connection doesn't
// block the check-in line.
//==================================================

function syncToServer(guestId) {

    const station =
        document
            .getElementById("station")
            .value
            .trim();

    const meal =
        document
            .getElementById("meal")
            .value
            .trim();

    fetch(

        SCRIPT_URL,

        {

            method: "POST",

            body: JSON.stringify({

                action: "scan",

                guestId: guestId,

                meal: meal,

                station: station

            })

        }

    )

    .then(response => response.json())

    .then(data => {

        if (
            data.status !== "success" &&
            data.status !== "duplicate"
        ) {

            console.warn(
                "Sync issue for",
                guestId,
                data
            );

        }

    })

    .catch(error => {

        console.error(
            "Background sync failed for",
            guestId,
            error
        );

        // Guest is still marked "taken" locally,
        // so no double check-in on this device.
        // Consider re-running refreshGuestData()
        // once connectivity is back.

    });

}


//==================================================
// MANUAL ENTRY (FALLBACK WHEN SCAN FAILS)
//==================================================

function submitManualEntry() {

    const input =
        document.getElementById("manualId");

    const guestId =
        input.value.trim();

    if (!guestId) {

        showResult(
            "error",
            `
            <div class="status">
                Enter a Guest ID first
            </div>
            `
        );

        return;

    }

    processGuestId(guestId, "manual");

    input.value = "";

}


// Allow pressing Enter in the manual ID field
// instead of requiring a tap on the button.

document
    .getElementById("manualId")
    .addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                event.preventDefault();

                submitManualEntry();

            }

        }
    );


//==================================================
// SCANNER ERRORS
//==================================================

function onScanError(error) {

    // Normal QR scanning errors are ignored.

}


//==================================================
// DISPLAY RESULT
//==================================================

function showResult(
    type,
    message
) {

    const result =
        document.getElementById("result");


    result.className = "";


    if (type) {

        result.classList.add(type);

    }


    result.innerHTML =
        message;

}

</script>


</body>
