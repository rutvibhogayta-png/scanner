<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meal Check-In</title>

    <!-- QR SCANNER LIBRARY -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin-top: 8px;
            color: #666;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #111827;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        button:active {
            transform: scale(0.98);
        }

        #reader {
            width: 100%;
            max-width: 450px;
            margin: auto;
        }

        #result {
            margin-top: 20px;
            padding: 18px;
            text-align: center;
            border-radius: 12px;
            background: #f1f5f9;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .success {
            background: #dcfce7 !important;
            color: #166534;
        }

        .duplicate {
            background: #fef3c7 !important;
            color: #92400e;
        }

        .error {
            background: #fee2e2 !important;
            color: #991b1b;
        }

        .name {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .status {
            font-size: 19px;
            font-weight: bold;
        }

        .small {
            font-size: 14px;
            margin-top: 6px;
        }

        .camera-status {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>Meal Check-In</h1>

        <p>
            Scan the guest QR code
        </p>

    </div>


    <!-- SETTINGS -->

    <div class="card">

        <label>
            Station
        </label>

        <input
            id="station"
            type="text"
            value="Station 1"
        >


        <label>
            Meal
        </label>

        <input
            id="meal"
            type="text"
            value="Meal"
        >


        <button
            id="startButton"
            onclick="requestCamera()"
        >
            📷 Start Camera
        </button>

    </div>


    <!-- SCANNER -->

    <div class="card">

        <div
            id="cameraStatus"
            class="camera-status"
        >
            Camera not started
        </div>


        <div id="reader"></div>


        <div id="result">

            <div>
                Press "Start Camera"
            </div>

        </div>

    </div>


</div>


<script>


//==================================================
// APPS SCRIPT URL
//==================================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyrO6ACLcH2XctMwaKeIRoTdGYGR6dlo6ZtfPBSiTOCV8_5FbQTWANZFIAllRXV3Lg/exec";


//==================================================
// VARIABLES
//==================================================

let scanner = null;

let processing = false;

let lastScanned = "";

let lastScanTime = 0;


//==================================================
// REQUEST CAMERA PERMISSION
//==================================================

async function requestCamera() {

    try {

        // Check browser support

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            showResult(
                "error",
                `
                <div class="status">
                    Camera Not Supported
                </div>

                <div class="small">
                    Please open this page in Chrome or Safari.
                </div>
                `
            );

            return;
        }


        // Request camera permission

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "environment"
                },

                audio: false

            });


        // Permission granted

        document
            .getElementById("cameraStatus")
            .innerText =
            "Camera permission granted";


        // Stop temporary camera stream

        stream
            .getTracks()
            .forEach(
                track => track.stop()
            );


        // Start QR scanner

        startScanner();


    }

    catch (error) {

        console.error(
            "Camera Error:",
            error
        );


        if (
            error.name === "NotAllowedError"
        ) {

            showResult(
                "error",
                `
                <div class="status">
                    Camera Permission Denied
                </div>

                <div class="small">
                    Please allow camera access
                    in your phone settings.
                </div>
                `
            );

        }

        else if (
            error.name === "NotFoundError"
        ) {

            showResult(
                "error",
                `
                <div class="status">
                    No Camera Found
                </div>
                `
            );

        }

        else {

            showResult(
                "error",
                `
                <div class="status">
                    Camera Error
                </div>

                <div class="small">
                    ${error.message}
                </div>
                `
            );

        }

    }

}


//==================================================
// START QR SCANNER
//==================================================

function startScanner() {

    if (scanner) {
        return;
    }


    scanner =
        new Html5Qrcode("reader");


    scanner.start(

        // IMPORTANT:
        // Keep this as a STRING.
        // Do NOT change it to an object.

        {
            facingMode: "environment"
        },


        // Scanner settings

        {
            fps: 15,

            qrbox: {
                width: 280,
                height: 280
            },

            aspectRatio: 1.0
        },


        // QR SUCCESS

        onScanSuccess,


        // QR ERROR

        onScanError

    )


    .then(() => {

        document
            .getElementById("cameraStatus")
            .innerText =
            "Camera active — scan QR";


        showResult(
            "",
            `
            <div class="status">
                Ready for Scan
            </div>

            <div class="small">
                Point the camera at a QR code.
            </div>
            `
        );


        document
            .getElementById("startButton")
            .innerText =
            "Camera Running";


        document
            .getElementById("startButton")
            .disabled =
            true;

    })


    .catch(error => {

        console.error(
            "Scanner Error:",
            error
        );


        showResult(
            "error",
            `
            <div class="status">
                Unable to Start Scanner
            </div>

            <div class="small">
                ${error}
            </div>
            `
        );

    });

}


//==================================================
// QR SCAN SUCCESS
//==================================================

function onScanSuccess(decodedText) {

    const now =
        Date.now();


    // Prevent duplicate scanning

    if (

        processing ||

        (
            decodedText === lastScanned &&
            now - lastScanTime < 3000
        )

    ) {

        return;
    }


    // Save scan

    lastScanned =
        decodedText;

    lastScanTime =
        now;

    processing =
        true;


    // Show QR detected

    showResult(
        "",
        `
        <div class="status">
            QR Detected
        </div>

        <div class="small">
            Checking guest...
        </div>
        `
    );


    // Send QR to Apps Script

    sendScan(decodedText);

}


//==================================================
// SEND SCAN TO APPS SCRIPT
//==================================================

function sendScan(guestId) {


    const station =
        document
            .getElementById("station")
            .value
            .trim();


    const meal =
        document
            .getElementById("meal")
            .value
            .trim();


    fetch(

        SCRIPT_URL,

        {

            method: "POST",

            body: JSON.stringify({

                action: "scan",

                guestId: guestId,

                meal: meal,

                station: station

            })

        }

    )


    .then(
        response => response.json()
    )


    .then(data => {


        // SUCCESS

        if (
            data.status === "success"
        ) {

            showResult(

                "success",

                `
                <div class="name">
                    ${data.name}
                </div>

                <div class="status">
                    ✓ MEAL COLLECTED
                </div>

                <div class="small">
                    Guest ID:
                    ${data.guestId || guestId}
                </div>
                `

            );

        }


        // DUPLICATE

        else if (
            data.status === "duplicate"
        ) {

            showResult(

                "duplicate",

                `
                <div class="name">
                    ${data.name}
                </div>

                <div class="status">
                    ⚠ ALREADY COLLECTED
                </div>

                <div class="small">
                    Guest ID:
                    ${data.guestId || guestId}
                </div>
                `

            );

        }


        // INVALID QR

        else {

            showResult(

                "error",

                `
                <div class="status">
                    ✗ INVALID QR
                </div>

                <div class="small">
                    ${
                        data.message ||
                        "Guest not found."
                    }
                </div>
                `

            );

        }

    })


    .catch(error => {

        console.error(
            "Server Error:",
            error
        );


        showResult(

            "error",

            `
            <div class="status">
                ⚠ CONNECTION ERROR
            </div>

            <div class="small">
                Could not contact server.
            </div>
            `

        );

    })


    .finally(() => {

        setTimeout(

            () => {

                processing =
                    false;


                showResult(

                    "",

                    `
                    <div class="status">
                        Ready for Next Scan
                    </div>
                    `

                );

            },

            1000

        );

    });

}


//==================================================
// SCANNER ERRORS
//==================================================

function onScanError(error) {

    // Normal QR scanning errors are ignored.

}


//==================================================
// DISPLAY RESULT
//==================================================

function showResult(
    type,
    message
) {

    const result =
        document.getElementById("result");


    result.className = "";


    if (type) {

        result.classList.add(type);

    }


    result.innerHTML =
        message;

}

</script>


</body>
