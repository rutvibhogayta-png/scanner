<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Meal Check-In</title>

<script src="https://unpkg.com/html5-qrcode"></script>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    padding: 0;

    font-family: Arial, sans-serif;

    background: #f4f6f8;

    color: #222;

}


.container {

    width: 100%;

    max-width: 600px;

    margin: auto;

    padding: 20px;

}


.header {

    text-align: center;

    margin-bottom: 20px;

}


.header h1 {

    margin: 0;

    font-size: 28px;

}


.header p {

    margin-top: 8px;

    color: #666;

}


.card {

    background: white;

    padding: 20px;

    margin-bottom: 20px;

    border-radius: 16px;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.08);

}


label {

    display: block;

    font-weight: bold;

    margin-bottom: 7px;

}


input {

    width: 100%;

    padding: 13px;

    margin-bottom: 15px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 16px;

}


button {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 9px;

    background: #111827;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 5px;

}


button:disabled {

    opacity: 0.55;

}


.secondary {

    background: #64748b;

}


#reader {

    width: 100%;

    max-width: 450px;

    margin: auto;

}


#result {

    margin-top: 20px;

    padding: 18px;

    text-align: center;

    border-radius: 12px;

    background: #f1f5f9;

    min-height: 80px;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

}


.success {

    background: #dcfce7 !important;

    color: #166534;

}


.duplicate {

    background: #fef3c7 !important;

    color: #92400e;

}


.error {

    background: #fee2e2 !important;

    color: #991b1b;

}


.name {

    font-size: 26px;

    font-weight: bold;

    margin-bottom: 6px;

}


.status {

    font-size: 19px;

    font-weight: bold;

}


.small {

    font-size: 14px;

    margin-top: 6px;

}


.camera-status {

    text-align: center;

    margin-bottom: 15px;

    font-size: 14px;

    color: #666;

}


.manual {

    margin-top: 10px;

}


.divider {

    text-align: center;

    color: #888;

    margin: 20px 0;

    font-size: 14px;

}


</style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>Meal Check-In</h1>

        <p>
            Scan the guest QR code
        </p>

    </div>


    <!-- SETTINGS -->

    <div class="card">


        <label>
            Station
        </label>


        <input
            id="station"
            type="text"
            value="Station 1"
        >


        <label>
            Meal
        </label>


        <input
            id="meal"
            type="text"
            value="Meal"
        >


    </div>


    <!-- QR SCANNER -->

    <div class="card">


        <div
            id="cameraStatus"
            class="camera-status"
        >
            Camera not started
        </div>


        <div id="reader"></div>


        <button
            id="startButton"
            onclick="requestCamera()"
        >
            📷 Start Camera
        </button>


        <div id="result">

            <div>
                Press "Start Camera"
            </div>

        </div>


    </div>


    <!-- MANUAL FALLBACK -->

    <div class="card manual">


        <div class="divider">
            QR not scanning?
        </div>


        <label>
            Enter Team Member Name
        </label>


        <input
            id="manualName"
            type="text"
            placeholder="Enter name"
            autocomplete="off"
        >


        <button
            class="secondary"
            onclick="manualCheckIn()"
        >
            Check In Manually
        </button>


    </div>


</div>


<script>


//==================================================
// APPS SCRIPT URL
//==================================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyrO6ACLcH2XctMwaKeIRoTdGYGR6dlo6ZtfPBSiTOCV8_5FbQTWANZFIAllRXV3Lg/exec";


//==================================================
// VARIABLES
//==================================================

let scanner = null;

let processing = false;

let lastScanned = "";

let lastScanTime = 0;


//==================================================
// REQUEST CAMERA
//==================================================

async function requestCamera() {


    try {


        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            showResult(

                "error",

                `
                <div class="status">
                    Camera Not Supported
                </div>

                <div class="small">
                    Please use Chrome or Safari.
                </div>
                `

            );

            return;

        }


        const stream =

            await navigator.mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            "environment"

                    },

                    audio: false

                });


        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        document
            .getElementById(
                "cameraStatus"
            )
            .innerText =
            "Camera permission granted";


        startScanner();


    }

    catch (error) {


        console.error(error);


        showResult(

            "error",

            `
            <div class="status">
                Camera Error
            </div>

            <div class="small">
                ${error.message}
            </div>
            `

        );

    }

}


//==================================================
// START SCANNER
//==================================================

function startScanner() {


    if (scanner) {

        return;

    }


    scanner =
        new Html5Qrcode(
            "reader"
        );


    scanner.start(

        {

            facingMode:
                "environment"

        },

        {

            fps: 15,

            qrbox: {

                width: 280,

                height: 280

            },

            aspectRatio: 1.0

        },

        onScanSuccess,

        onScanError

    )


    .then(() => {


        document
            .getElementById(
                "cameraStatus"
            )
            .innerText =
            "Camera active — scan QR";


        document
            .getElementById(
                "startButton"
            )
            .innerText =
            "Camera Running";


        document
            .getElementById(
                "startButton"
            )
            .disabled =
            true;


        showResult(

            "",

            `
            <div class="status">
                Ready for Scan
            </div>

            <div class="small">
                Point camera at QR code.
            </div>
            `

        );

    })


    .catch(error => {


        console.error(error);


        showResult(

            "error",

            `
            <div class="status">
                Unable to Start Scanner
            </div>

            <div class="small">
                ${error}
            </div>
            `

        );

    });

}


//==================================================
// QR SUCCESS
//==================================================

function onScanSuccess(decodedText) {


    const now =
        Date.now();


    // Prevent duplicate camera detections

    if (

        processing ||

        (

            decodedText ===
            lastScanned &&

            now -
            lastScanTime <
            3000

        )

    ) {

        return;

    }


    lastScanned =
        decodedText;


    lastScanTime =
        now;


    processing =
        true;


    showResult(

        "",

        `
        <div class="status">
            QR Detected
        </div>

        <div class="small">
            Checking...
        </div>
        `

    );


    // IMPORTANT:
    // Use google.script.run instead of fetch.
    // This avoids an extra HTTP request through
    // the Apps Script URL.

    google.script.run

        .withSuccessHandler(
            handleResult
        )

        .withFailureHandler(
            handleServerError
        )

        .processScan(

            decodedText,

            getMeal(),

            getStation()

        );

}


//==================================================
// MANUAL CHECK-IN
//==================================================

function manualCheckIn() {


    if (processing) {

        return;

    }


    const name =
        document
            .getElementById(
                "manualName"
            )
            .value
            .trim();


    if (!name) {


        showResult(

            "error",

            `
            <div class="status">
                Enter a Name
            </div>
            `

        );


        return;

    }


    processing =
        true;


    showResult(

        "",

        `
        <div class="status">
            Checking...
        </div>

        <div class="small">
            Finding ${escapeHtml(name)}
        </div>
        `

    );


    google.script.run

        .withSuccessHandler(
            handleResult
        )

        .withFailureHandler(
            handleServerError
        )

        .processManualCheckIn(

            name,

            getMeal(),

            getStation()

        );

}


//==================================================
// RESULT HANDLER
//==================================================

function handleResult(data) {


    processing =
        false;


    if (!data) {

        showResult(

            "error",

            `
            <div class="status">
                No Response
            </div>
            `

        );

        return;

    }


    //==============================================
    // SUCCESS
    //==============================================

    if (
        data.status ===
        "success"
    ) {


        showResult(

            "success",

            `
            <div class="name">
                ${escapeHtml(
                    data.name
                )}
            </div>

            <div class="status">
                ✓ MEAL COLLECTED
            </div>

            <div class="small">
                ${escapeHtml(
                    data.guestId
                )}
            </div>
            `

        );


        clearManualName();


        // Return to ready state

        setTimeout(

            () => {

                if (!processing) {

                    showResult(

                        "",

                        `
                        <div class="status">
                            Ready for Next Scan
                        </div>
                        `

                    );

                }

            },

            1200

        );


        return;

    }


    //==============================================
    // DUPLICATE
    //==============================================

    if (
        data.status ===
        "duplicate"
    ) {


        showResult(

            "duplicate",

            `
            <div class="name">
                ${escapeHtml(
                    data.name
                )}
            </div>

            <div class="status">
                ⚠ ALREADY COLLECTED
            </div>

            <div class="small">
                ${escapeHtml(
                    data.guestId
                )}
            </div>
            `

        );


        clearManualName();


        setTimeout(

            () => {

                showResult(

                    "",

                    `
                    <div class="status">
                        Ready for Next Scan
                    </div>
                    `

                );

            },

            1200

        );


        return;

    }


    //==============================================
    // INVALID
    //==============================================

    showResult(

        "error",

        `
        <div class="status">
            ✗ NOT FOUND
        </div>

        <div class="small">
            ${escapeHtml(
                data.message ||
                "Guest not found."
            )}
        </div>
        `

    );


    processing =
        false;

}


//==================================================
// SERVER ERROR
//==================================================

function handleServerError(error) {


    processing =
        false;


    console.error(error);


    showResult(

        "error",

        `
        <div class="status">
            ⚠ CONNECTION ERROR
        </div>

        <div class="small">
            Please try again.
        </div>
        `

    );

}


//==================================================
// GET STATION
//==================================================

function getStation() {

    return document
        .getElementById(
            "station"
        )
        .value
        .trim();

}


//==================================================
// GET MEAL
//==================================================

function getMeal() {

    return document
        .getElementById(
            "meal"
        )
        .value
        .trim();

}


//==================================================
// CLEAR MANUAL NAME
//==================================================

function clearManualName() {

    document
        .getElementById(
            "manualName"
        )
        .value = "";

}


//==================================================
// QR ERRORS
//==================================================

function onScanError(error) {

    // Ignore normal QR detection errors.

}


//==================================================
// SHOW RESULT
//==================================================

function showResult(
    type,
    message
) {


    const result =
        document.getElementById(
            "result"
        );


    result.className =
        "";


    if (type) {

        result.classList.add(
            type
        );

    }


    result.innerHTML =
        message;

}


//==================================================
// ESCAPE HTML
//==================================================

function escapeHtml(value) {

    return String(value || "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>


</body>

</html>
